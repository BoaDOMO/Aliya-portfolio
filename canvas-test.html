<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        if (saved) {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas BG Test — Aliya Koy</title>
    <link rel="stylesheet" href="style.css?v=2" />
    <link rel="stylesheet" href="mediaqueries.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
      #bgCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      .main-wrapper {
        position: relative;
        z-index: 1;
      }

      /* ── GRADIENT PICKER ── */
      .gradient-picker-toggle {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        z-index: 100;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--color-card);
        border: 1px solid var(--color-border);
        box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        cursor: pointer;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 200ms ease;
        color: var(--color-text-gray);
      }

      .gradient-picker-toggle:hover {
        transform: scale(1.1);
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      }

      .gradient-picker {
        position: fixed;
        bottom: 5rem;
        right: 1.5rem;
        z-index: 100;
        background: var(--color-card);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 1rem;
        box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        width: 280px;
        display: none;
      }

      .gradient-picker.open { display: block; }

      .gp-header {
        font-family: var(--font-body);
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--color-near-black);
        margin-bottom: 0.6rem;
      }

      .gp-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.4rem;
        margin-bottom: 0.6rem;
      }

      .gp-combo-card {
        border: 2px solid transparent;
        border-radius: 8px;
        padding: 0.3rem;
        cursor: pointer;
        transition: all 200ms ease;
        background: var(--color-card);
      }

      .gp-combo-card:hover {
        transform: translateY(-1px);
      }

      .gp-combo-card.active {
        border-color: var(--color-blue);
      }

      .gp-preview {
        height: 40px;
        border-radius: 5px;
        background-size: cover;
      }

      .gp-combo-label {
        font-family: var(--font-mono);
        font-size: 0.55rem;
        text-align: center;
        color: var(--color-text-gray);
        margin-top: 0.2rem;
      }

      .gp-reset {
        width: 100%;
        font-family: var(--font-mono);
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.35rem;
        border: 1px solid var(--color-border);
        border-radius: 6px;
        background: transparent;
        color: var(--color-text-muted);
        cursor: pointer;
        transition: all 200ms ease;
      }

      .gp-reset:hover {
        border-color: var(--color-blue);
        color: var(--color-blue);
      }

      :root[data-theme="dark"] .gradient-picker-toggle {
        background: rgba(22,22,24,0.9);
        backdrop-filter: blur(8px);
        border-color: var(--color-border);
      }

      :root[data-theme="dark"] .gradient-picker {
        background: rgba(22,22,24,0.95);
        backdrop-filter: blur(14px);
        border-color: var(--color-border);
      }
    </style>
  </head>
  <body class="main-wrapper">

    <canvas id="bgCanvas"></canvas>

    <div id="nav">
      <nav id="desktop-nav">
        <div>
          <a href="./index.html" class="nav-logo"><h2>ALIYA KOY</h2></a>
        </div>
        <div>
          <ul class="nav-links">
            <li><a href="./index.html">Home</a></li>
            <li><a href="./profile.html">Profile</a></li>
            <li><a href="./lab.html">Lab</a></li>
            <li><a href="./contact.html">Contact</a></li>
            <li><button class="theme-toggle" id="themeToggleDesktop" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button></li>
          </ul>
        </div>
      </nav>
      <nav id="hamburger-nav">
        <div>
          <a href="./index.html" class="nav-logo"><h2>ALIYA KOY</h2></a>
        </div>
        <div class="hamburger-menu">
          <div style="display: flex; align-items: center; gap: 1.25rem;">
            <div class="hamburger-icon" onclick="toggleMenu()">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <button class="theme-toggle" id="themeToggleMobile" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
          </div>
          <div class="menu-links">
            <li><a href="./index.html" onclick="toggleMenu()">Home</a></li>
            <li><a href="./profile.html" onclick="toggleMenu()">Profile</a></li>
            <li><a href="./lab.html" onclick="toggleMenu()">Lab</a></li>
            <li><a href="./contact.html" onclick="toggleMenu()">Contact</a></li>
          </div>
        </div>
      </nav>
    </div>

    <main class="page-load-anim">
      <div class="grid-container">
        <section class="page-hero">
          <p class="hero-label anim-hero-label">CANVAS BACKGROUND TEST</p>
          <h1 class="hero-name">Dark: Constellations + Aurora</h1>
          <p class="hero-tagline anim-hero-tagline">Light: Warm Aurora</p>
          <div class="hero-btns anim-hero-btns">
            <button class="btn btn-color-1 hero-btn" onclick="document.documentElement.getAttribute('data-theme') === 'dark' ? document.documentElement.setAttribute('data-theme', 'light') : document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', document.documentElement.getAttribute('data-theme'))">Toggle Theme</button>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <p>Copyright &#169; 2026 Aliya Koy. All Rights Reserved.</p>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="Back to top">
      <i class="fa-solid fa-chevron-up"></i>
    </button>

    <script src="src/canvas-bg.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var canvas = document.getElementById('bgCanvas');
        window.bg = new CanvasBackground(canvas);
      });
    </script>
    <script src="script.js"></script>
    <script>
      (function () {
        var root = document.documentElement;

        function updateIcons() {
          var theme = root.getAttribute('data-theme');
          var isDark = theme === 'dark';
          document.querySelectorAll('.theme-toggle i').forEach(function (icon) {
            if (isDark) {
              icon.classList.remove('fa-moon');
              icon.classList.add('fa-sun');
            } else {
              icon.classList.remove('fa-sun');
              icon.classList.add('fa-moon');
            }
          });
        }

        updateIcons();

        document.querySelectorAll('.theme-toggle').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var current = root.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateIcons();
          });
        });
      })();
  </script>

  <!-- ── GRADIENT PICKER ── -->
  <button class="gradient-picker-toggle" id="gpToggle" onclick="togglePicker()">
    <i class="fa-solid fa-palette"></i>
  </button>
  <div class="gradient-picker" id="gpPanel">
    <div class="gp-header">Light Mode — Pick a Combo</div>
    <div class="gp-grid" id="gpGrid"></div>
    <button class="gp-reset" onclick="randomGradient()">↻ Random</button>
  </div>

  <script>
    var LIGHT_COMBOS = [
      { label: '#1 Diagonal Split', dir: 'to bottom right', stops: [{ pos: '0%', color: 'rgba(156,175,136,0.4)' }, { pos: '100%', color: 'rgba(255,235,200,0.5)' }] },
      { label: '#2 Top Blend', dir: 'to bottom', stops: [{ pos: '0%', color: 'rgba(156,175,136,0.35)' }, { pos: '50%', color: 'rgba(255,235,200,0.3)' }, { pos: '100%', color: 'transparent' }] },
      { label: '#3 Bottom Glow', dir: 'to top', stops: [{ pos: '0%', color: 'rgba(156,175,136,0.3)' }, { pos: '50%', color: 'rgba(255,235,200,0.4)' }, { pos: '100%', color: 'transparent' }] },
      { label: '#4 Corner Overlap', dir: 'to bottom left', stops: [{ pos: '0%', color: 'rgba(255,235,200,0.5)' }, { pos: '60%', color: 'rgba(255,235,200,0.1)' }, { pos: '100%', color: 'transparent' }] },
      { label: '#5 Cascade', dir: 'to bottom', stops: [{ pos: '0%', color: 'rgba(156,175,136,0.3)' }, { pos: '40%', color: 'rgba(255,235,200,0.4)' }, { pos: '70%', color: 'rgba(156,175,136,0.15)' }, { pos: '100%', color: 'transparent' }] }
    ];
    var gpSelectedIndex = 0;

    function togglePicker() {
      var panel = document.getElementById('gpPanel');
      panel.classList.toggle('open');
      if (panel.classList.contains('open')) renderCombos();
    }

    function renderCombos() {
      var grid = document.getElementById('gpGrid');
      grid.innerHTML = '';
      LIGHT_COMBOS.forEach(function(combo, i) {
        var card = document.createElement('div');
        card.className = 'gp-combo-card';
        if (i === gpSelectedIndex) card.classList.add('active');

        var preview = document.createElement('div');
        preview.className = 'gp-preview';
        var bgStops = combo.stops.map(function(s) { return s.color + ' ' + s.pos; }).join(', ');
        preview.style.background = 'linear-gradient(' + combo.dir + ', ' + bgStops + ')';
        card.appendChild(preview);

        var label = document.createElement('div');
        label.className = 'gp-combo-label';
        label.textContent = combo.label;
        card.appendChild(label);

        card.onclick = function() { selectCombo(i); };
        grid.appendChild(card);
      });
    }

    function selectCombo(index) {
      gpSelectedIndex = index;
      if (window.bg) window.bg.setLightCombo(index);
      document.querySelectorAll('.gp-combo-card').forEach(function(c, i) {
        c.classList.toggle('active', i === index);
      });
    }

    function randomGradient() {
      var i = Math.floor(Math.random() * LIGHT_COMBOS.length);
      selectCombo(i);
    }
  </script>
</body>
</html>
