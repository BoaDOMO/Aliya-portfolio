<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        if (saved) {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aliya Koy</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="mediaqueries.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  </head>
  <body class="main-wrapper">

    <div id="nav">
      <nav id="desktop-nav">
        <div>
          <a href="./index.html" class="nav-logo"><h2>ALIYA KOY</h2></a>
        </div>
        <div>
          <ul class="nav-links">
            <li><a href="./index.html">Home</a></li>
            <li><a href="./profile.html">Profile</a></li>
            <li><a href="./lab.html">Lab</a></li>
            <li><a href="./contact.html">Contact</a></li>
            <li><button class="theme-toggle" id="themeToggleDesktop" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button></li>
          </ul>
        </div>
      </nav>
      <nav id="hamburger-nav">
        <div>
          <a href="./index.html" class="nav-logo"><h2>ALIYA KOY</h2></a>
        </div>
        <div class="hamburger-menu">
          <div style="display: flex; align-items: center; gap: 1.25rem;">
            <div class="hamburger-icon" onclick="toggleMenu()">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <button class="theme-toggle" id="themeToggleMobile" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
          </div>
          <div class="menu-links">
            <li><a href="./index.html" onclick="toggleMenu()">Home</a></li>
            <li><a href="./profile.html" onclick="toggleMenu()">Profile</a></li>
            <li><a href="./lab.html" onclick="toggleMenu()">Lab</a></li>
            <li><a href="./contact.html" onclick="toggleMenu()">Contact</a></li>
          </div>
        </div>
      </nav>
    </div>

    <main class="page-load-anim">
      <section class="page-hero">
        <p class="hero-label anim-hero-label">HELLO, I'M</p>
        <h1 class="hero-name">Aliya Koy</h1>
        <p class="hero-tagline anim-hero-tagline">A small lab for things I want to build.</p>
        <div class="hero-btns anim-hero-btns">
          <button class="btn btn-color-1 hero-btn" onclick="window.location.href='./profile.html'">View Profile &rarr;</button>
          <button class="btn btn-color-2 hero-btn" onclick="window.location.href='./contact.html'">Get in Touch</button>
        </div>
      </section>
    </main>

    <footer>
      <p>Copyright &#169; 2026 Aliya Koy. All Rights Reserved.</p>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="Back to top">
      <i class="fa-solid fa-chevron-up"></i>
    </button>

    <script src="script.js"></script>
    <script>
      (function () {
        var root = document.documentElement;

        function updateIcons() {
          var theme = root.getAttribute('data-theme');
          var isDark = theme === 'dark';
          document.querySelectorAll('.theme-toggle i').forEach(function (icon) {
            if (isDark) {
              icon.classList.remove('fa-sun');
              icon.classList.add('fa-moon');
            } else {
              icon.classList.remove('fa-moon');
              icon.classList.add('fa-sun');
            }
          });
        }

        updateIcons();

        document.querySelectorAll('.theme-toggle').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var current = root.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateIcons();
          });
        });
      })();
    </script>
  </body>
</html>
